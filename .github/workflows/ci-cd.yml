name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *" # Corre todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  backup-supabase:
    name: Backup Supabase
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' # Solo en programación o ejecución manual
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Instalar dependencias
        working-directory: ./database-tools
        run: npm install pg dotenv
        
      - name: Ejecutar backup de Supabase
        working-directory: ./database-tools
        env:
          # Usar la URL completa de conexión
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          # Variables individuales como respaldo
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST || 'db.fiytqkeoolnmspmbjijo.supabase.co' }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT || '5432' }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME || 'postgres' }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER || 'postgres' }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node supabase-backup.js
        
      - name: Subir respaldo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: ./backups/supabase/
          retention-days: 7
          if-no-files-found: error
